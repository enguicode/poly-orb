<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Poly Orb — Generador de Entes Polifórmicos 3D</title>
<meta name="description" content="Genera entes 3D vivos: poliedros con satélites, anillos y respiración, cada uno con su semilla de ADN.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://enguicode.github.io/poly-orb/">
<meta property="og:title" content="Poly Orb — Generador de Entes Polifórmicos 3D">
<meta property="og:description" content="Genera entes 3D vivos: poliedros con satélites, anillos y respiración, cada uno con su semilla de ADN.">
<meta property="og:image" content="https://enguicode.github.io/poly-orb/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040409;
    --panel: #0e101b;
    --ink: #f5f6fc;
    --sub: #9298b2;
    --line: rgba(255, 255, 255, 0.11);
    --working: #3ff0c4;
    --waiting: #ffb84d;
    --blocked: #ff4d73;
    --resting: #8890b0;
    --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%; background: #000; color: var(--ink); font-family: var(--sans);
    display: flex; align-items: center; justify-content: center; padding: 12px 0;
  }
  .shell {
    position: relative; width: 412px; height: 915px; flex-shrink: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 22%, #13162b 0%, #070812 46%, #040409 100%);
    border-radius: 42px; border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 44px 130px rgba(0,0,0,0.96);
    display: flex; flex-direction: column;
    transition: width 0.28s ease, height 0.28s ease, border-radius 0.28s ease;
  }
  @media (max-width: 440px) {
    html, body { height: 100%; padding: 0; overflow: hidden; }
    .shell { width: 100vw; height: 100dvh; border-radius: 0; border: none; }
  }
  /* PC Responsive Studio Layout (keeps exact same mobile controls untouched!) */
  @media (min-width: 860px) {
    body { padding: 18px; }
    .shell:not(.force-mobile):not(.fullscreen-hold) {
      width: min(1120px, 95vw);
      height: min(840px, 93vh);
      border-radius: 30px;
    }
    .shell:not(.force-mobile):not(.fullscreen-hold) #viewLab.active {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 412px;
      gap: 0;
    }
    .shell:not(.force-mobile):not(.fullscreen-hold) .lab-left {
      display: flex; flex-direction: column; min-width: 0; height: 100%;
      border-right: 1px solid var(--line); padding-bottom: 14px;
    }
    .shell:not(.force-mobile):not(.fullscreen-hold) .hero-stage {
      flex: 1; height: auto; min-height: 0;
    }
    .shell:not(.force-mobile):not(.fullscreen-hold) .controls-scroll {
      padding: 4px 16px 18px;
    }
    .shell:not(.force-mobile):not(.fullscreen-hold) .batch-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .shell:not(.force-mobile):not(.fullscreen-hold) .batch-card canvas {
      width: 120px; height: 120px;
    }
    .pc-only-btn { display: inline-flex !important; }
  }
  .pc-only-btn { display: none; }

  /* Fullscreen "MANTENER" Mode */
  .shell.fullscreen-hold {
    position: fixed; inset: 0; z-index: 100;
    width: 100vw !important; height: 100dvh !important;
    border-radius: 0 !important; border: none !important;
  }
  .shell.fullscreen-hold .topbar,
  .shell.fullscreen-hold .sync-strip,
  .shell.fullscreen-hold .controls-scroll,
  .shell.fullscreen-hold #viewBatch {
    display: none !important;
  }
  .shell.fullscreen-hold #viewLab {
    display: flex !important; flex: 1; height: 100%;
  }
  .shell.fullscreen-hold .lab-left {
    flex: 1; height: 100%; display: flex; flex-direction: column; border: none; padding: 0;
  }
  .shell.fullscreen-hold .hero-stage {
    flex: 1; height: 100%;
  }
  .fs-bar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 120;
    display: none; align-items: center; gap: 8px; padding: 7px 10px 7px 14px;
    border-radius: 999px; background: rgba(8, 10, 18, 0.72); backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
  }
  .shell.fullscreen-hold .fs-bar { display: flex; }
  .fs-bar { width: max-content; max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; border-radius: 22px; padding: 9px 10px; }
  .fs-bar > * { white-space: nowrap; }
  .fs-bar > #fsLabel { flex-basis: 100%; text-align: center; white-space: normal; overflow-wrap: anywhere; padding: 2px 4px 4px; }
  .lab-left { display: flex; flex-direction: column; flex-shrink: 0; }
  .mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.11em; font-size: 8.8px; }

  /* Top Mobile Bar */
  .topbar {
    position: relative; z-index: 20; padding: 15px 16px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
  }
  .mode-pills {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px;
    border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--line);
    flex: 1;
  }
  .m-btn {
    padding: 7px 10px; border-radius: 999px; border: none; background: transparent;
    color: var(--sub); font-family: var(--mono); font-size: 8.5px; cursor: pointer; transition: all 0.2s;
  }
  .m-btn.active { background: var(--ink); color: #040409; font-weight: 700; }
  .rnd-btn {
    height: 33px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.07); color: var(--ink); font-family: var(--mono); font-size: 9px; cursor: pointer;
  }
  .rnd-btn:hover { background: rgba(255,255,255,0.14); }

  .view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* Hero Interactive 3D Stage */
  .hero-stage { position: relative; height: 274px; flex-shrink: 0; }
  #heroCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none;
  }
  #heroCanvas:active { cursor: grabbing; }

  /* 1:1 Avatar Scale Preview Strip */
  .sync-strip {
    margin: 0 14px 10px; padding: 10px 12px; border-radius: 20px;
    background: rgba(255,255,255,0.045); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
  }
  .sync-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .avatar-canvas {
    display: block; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
  }

  /* Mobile Sliders & Pickers Scroll */
  .controls-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 16px;
    display: flex; flex-direction: column; gap: 11px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent;
  }
  .ctrl-card {
    padding: 12px 13px; border-radius: 20px; background: rgba(16,18,30,0.78);
    border: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px;
  }
  .ctrl-head { display: flex; justify-content: space-between; align-items: center; }
  .ctrl-lbl { color: var(--sub); font: 500 12.5px var(--sans); }
  .ctrl-val { color: var(--ink); font: 600 12px var(--mono); }
  .grp-title { color: var(--ink); font: 700 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; }
  .sep { height: 1px; background: var(--line); margin: 3px 0; }
  .ticks { display: flex; justify-content: space-between; color: var(--sub); font: 500 10.5px var(--sans); }
  .seed-code {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid transparent; outline: none; padding: 0;
    color: var(--ink); font: 700 15px var(--mono); letter-spacing: 0.06em;
  }
  .seed-code:focus { border-bottom-color: rgba(255,255,255,0.36); }
  .seed-sub { color: var(--sub); font: 500 11.5px var(--sans); margin-top: 2px; }
  .share-btn {
    flex-shrink: 0; padding: 9px 14px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--ink); color: #040409; font: 700 12.5px var(--sans);
  }
  input[type=range].hue-range {
    -webkit-appearance: none; appearance: none; height: 26px; border-radius: 13px; border: 1px solid var(--line);
    background: linear-gradient(90deg, hsl(0 90% 65%), hsl(60 90% 65%), hsl(120 90% 65%), hsl(180 90% 65%), hsl(240 90% 65%), hsl(300 90% 65%), hsl(360 90% 65%));
  }
  .hue-range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff;
    background: var(--thumb, #fff); box-shadow: 0 2px 8px rgba(0,0,0,0.65); cursor: grab;
  }
  .hue-range::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff;
    background: var(--thumb, #fff); box-shadow: 0 2px 8px rgba(0,0,0,0.65); cursor: grab;
  }



  .swatch-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .sw-dot {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    box-shadow: 0 0 12px color-mix(in srgb, var(--c) 45%, transparent); transition: transform 0.18s;
  }
  .sw-dot:hover { transform: scale(1.12); }
  .sw-dot.on { border-color: #ffffff; transform: scale(1.14); }

  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  input[type=range] { width: 100%; accent-color: #f5f6fc; height: 4px; cursor: pointer; }

  .state-row {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 3px;
    border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
  }
  .st-btn {
    padding: 8px 2px; border-radius: 11px; border: none; background: transparent; color: var(--sub);
    font: 500 12px var(--sans); cursor: pointer; white-space: nowrap;
  }
  .st-btn.on { background: var(--ink); color: #040409; font-weight: 700; }


  /* VIEW 2: 12-ENTITY RANDOM BATCH GRID (MOBILE 3x4) */
  .batch-head {
    padding: 2px 16px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .batch-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 16px;
  }
  .batch-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;
  }
  .batch-card {
    min-width: 0; padding: 10px 6px 9px; border-radius: 18px;
    background: rgba(255,255,255,0.035); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer; transition: border-color 0.18s, background 0.18s, transform 0.18s;
  }
  .batch-card:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.28); transform: translateY(-2px); }
  .batch-card.selected { border-color: var(--ec); background: color-mix(in srgb, var(--ec) 14%, rgba(255,255,255,0.04)); }
  .batch-card canvas { width: 84px; height: 84px; display: block; }
  .bc-seed { font-size: 8.8px; color: var(--ink); font-weight: 600; }
  .bc-sub { font-size: 7.2px; color: var(--sub); text-align: center; }

  .toast {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%); z-index: 80;
    padding: 6px 13px; border-radius: 999px; background: var(--ink); color: #040409;
    font-family: var(--mono); font-weight: 700; font-size: 8.5px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="toast mono" id="toast"></div>

  <!-- Floating Exit Bar when in Fullscreen "MANTENER" Mode -->
  <div class="fs-bar">
    <span class="mono" style="color:var(--sub)" id="fsLabel">d1a4f801 · 80 CARAS</span>
    <button class="rnd-btn" style="height:30px;font-size:8.5px" onclick="randomizeCurrent()">🎲 AZAR</button>
    <button class="rnd-btn" style="height:30px;font-size:8.5px" onclick="shareEntity()">↗ COMPARTIR</button>
    <button class="rnd-btn" style="height:30px;font-size:8.5px;background:var(--ink);color:#040409;font-weight:700" onclick="toggleHoldFullscreen(false)">SALIR ✕</button>
  </div>

  <!-- Top Bar (Mobile + PC adaptive, exact same options) -->
  <header class="topbar">
    <div class="mode-pills">
      <button class="m-btn active" id="btnLab" onclick="setView('lab')">LABORATORIO</button>
      <button class="m-btn" id="btnBatch" onclick="setView('batch')">LOTE AZAR (12)</button>
    </div>
    <button class="rnd-btn" onclick="toggleHoldFullscreen(true)" title="Mantener a pantalla completa">⛶ MANTENER</button>
    <button class="rnd-btn pc-only-btn" id="layoutBtn" onclick="toggleMobilePreview()" style="align-items:center">MÓVIL</button>
    <button class="rnd-btn" onclick="randomizeCurrent()">🎲 AZAR</button>
  </header>

  <!-- VIEW 1: INTERACTIVE LAB (Vertical on Mobile, 2-Column on PC, exact same controls) -->
  <section class="view active" id="viewLab">
    <div class="lab-left">
      <div class="hero-stage">
        <canvas id="heroCanvas"></canvas>
      </div>

      <!-- Live 1:1 Profile Icon Coincidence Preview -->
      <div class="sync-strip">
        <div class="sync-left">
          <canvas class="avatar-canvas" id="syncAv42" width="84" height="84" style="width:42px;height:42px" title="Toca para reaccionar"></canvas>
          <div style="min-width:0;flex:1">
            <input class="seed-code" id="seedInput" spellcheck="false" autocomplete="off" aria-label="Código de la figura" title="Pega un código para cargar su figura">
            <div class="seed-sub" id="syncSpec"></div>
          </div>
        </div>
        <button class="share-btn" onclick="shareEntity()">↗ Compartir</button>
      </div>
    </div>

    <!-- Sliders & Pickers -->
    <div class="controls-scroll">
      <div class="ctrl-card">
        <span class="grp-title">Cuerpo</span>
        <div class="slider-row">
          <div class="ctrl-head"><span class="ctrl-lbl">Forma</span><span class="ctrl-val" id="facesVal"></span></div>
          <input type="range" id="facesSlider" min="0" max="18" step="1" value="18" aria-label="Forma">
          <div class="ticks"><span>Tetraedro</span><span>Poliforma</span></div>
        </div>
        <div class="sep"></div>
        <div class="ctrl-head"><span class="ctrl-lbl">Color</span><span class="ctrl-val" id="palName"></span></div>
        <div class="swatch-row" id="swatchRow"></div>
        <input type="range" id="hueSlider" class="hue-range" min="0" max="359" step="1" aria-label="Color libre">
        <div class="sep"></div>
        <div class="slider-row">
          <div class="ctrl-head"><span class="ctrl-lbl">Respiración</span><span class="ctrl-val" id="morphVal"></span></div>
          <input type="range" id="morphSlider" min="0" max="100" step="1" aria-label="Respiración">
        </div>
      </div>

      <div class="ctrl-card">
        <span class="grp-title">Órbita</span>
        <div class="slider-row">
          <div class="ctrl-head"><span class="ctrl-lbl">Satélites</span><span class="ctrl-val" id="satVal"></span></div>
          <input type="range" id="satSlider" min="0" max="5" step="1" aria-label="Satélites">
        </div>
        <div class="slider-row">
          <div class="ctrl-head"><span class="ctrl-lbl">Anillos</span><span class="ctrl-val" id="ringVal"></span></div>
          <input type="range" id="ringSlider" min="0" max="3" step="1" aria-label="Anillos">
        </div>
      </div>

      <div class="ctrl-card">
        <span class="ctrl-lbl">Vista previa de estado</span>
        <div class="state-row" id="stateRow"></div>
      </div>
    </div>
  </section>

  <!-- VIEW 2: 12 RANDOM ALGORITHMIC ENTITIES (MOBILE 3x4 GRID) -->
  <section class="view" id="viewBatch">
    <div class="batch-head">
      <span class="mono" style="color:var(--sub)">12 IDs ALEATORIOS · TOCA PARA EDITAR</span>
      <button class="rnd-btn" style="height:28px;font-size:8px" onclick="generateBatch()">NUEVO LOTE ↻</button>
    </div>
    <div class="batch-scroll">
      <div class="batch-grid" id="batchGrid"></div>
    </div>
  </section>
</div>

<script type="module">
import {FACE_STEPS,PALETTES,STATUS_META,getSolid,getFaceMeta,hashStr,encodeSeed,decodeSeed,randomSeed,generateEntityFromSeed,entityFromText,hexRgb,drawLivingEntity,stepEntity} from './poly-orb.js';

// Shared link: ?seed=<seed> (bare ?<seed> from older links; 404.html turns /poly-orb/<seed> into this)
const qs=new URLSearchParams(location.search);
const urlSeed=(qs.get('seed')||[...qs.keys()][0]||'').trim().slice(0,64);
let currentEntity=generateEntityFromSeed(urlSeed||randomSeed(),'working');
let batch=[];
let currentView='lab';


/* Touch / Drag / Poke */
const heroCanvas=document.getElementById('heroCanvas');
function sizeHero(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  if(heroCanvas.clientWidth>0&&heroCanvas.clientHeight>0){
    heroCanvas.width=Math.round(heroCanvas.clientWidth*dpr);
    heroCanvas.height=Math.round(heroCanvas.clientHeight*dpr);
    heroCanvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  }
}
sizeHero();

let dragging=false,lx=0,ly=0,moved=0,holdTimer=null,didHold=false;
heroCanvas.addEventListener('pointerdown',e=>{
  dragging=true;lx=e.clientX;ly=e.clientY;moved=0;didHold=false;
  heroCanvas.setPointerCapture?.(e.pointerId);
  clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{
    if(dragging&&moved<10){
      didHold=true;
      const isFs=document.getElementById('shell').classList.contains('fullscreen-hold');
      toggleHoldFullscreen(!isFs);
    }
  },460);
});
heroCanvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.hypot(dx,dy);
  if(moved>=10)clearTimeout(holdTimer);
  currentEntity.rotY+=dx*0.014;currentEntity.rotX+=dy*0.014;currentEntity.velY=dx*0.012;currentEntity.velX=dy*0.012;
});
heroCanvas.addEventListener('pointerup',()=>{
  clearTimeout(holdTimer);
  if(dragging&&moved<8&&!didHold){currentEntity.poke=1.0;currentEntity.velY+=(Math.random()>0.5?1:-1)*0.16;}
  dragging=false;
});
window.addEventListener('resize',sizeHero);
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('shell').classList.contains('fullscreen-hold'))toggleHoldFullscreen(false);
});
function toggleHoldFullscreen(on){
  const sh=document.getElementById('shell');
  sh.classList.toggle('fullscreen-hold',on);
  if(on){
    setView('lab');
    if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  }
  currentEntity.poke=0.8;
  requestAnimationFrame(()=>sizeHero());
  setTimeout(sizeHero,310);
}
function toggleMobilePreview(){
  const sh=document.getElementById('shell');
  const mob=sh.classList.toggle('force-mobile');
  document.getElementById('layoutBtn').textContent=mob?'PC':'MÓVIL';
  requestAnimationFrame(()=>sizeHero());
  setTimeout(sizeHero,310);
}
document.getElementById('syncAv42').addEventListener('click',()=>{currentEntity.poke=1.0;});

function setView(v){
  currentView=v;
  document.getElementById('btnLab').classList.toggle('active',v==='lab');
  document.getElementById('btnBatch').classList.toggle('active',v==='batch');
  document.getElementById('viewLab').classList.toggle('active',v==='lab');
  document.getElementById('viewBatch').classList.toggle('active',v==='batch');
  sizeHero();
}

function renderControls(){
  const ent=currentEntity;
  const fMeta=getFaceMeta(ent.faces);
  const fIdx=FACE_STEPS.findIndex(s=>s.faces===fMeta.faces);
  const title=s=>s.charAt(0)+s.slice(1).toLowerCase();
  const pal=PALETTES.find(p=>p.primary===ent.primary&&p.secondary===ent.secondary);
  if(document.activeElement!==document.getElementById('seedInput'))document.getElementById('seedInput').value=ent.seed;
  document.getElementById('syncSpec').textContent=`${title(fMeta.name)} · ${ent.satellites} satélite${ent.satellites===1?'':'s'} · ${ent.rings} anillo${ent.rings===1?'':'s'}`;
  document.getElementById('fsLabel').textContent=`${ent.seed} · ${fMeta.faces} CARAS · ${fMeta.name}`;
  history.replaceState(null,'','?seed='+encodeURIComponent(ent.seed));
  document.getElementById('facesVal').textContent=`${fMeta.faces} caras · ${title(fMeta.name)}`;
  document.getElementById('facesSlider').value=fIdx>=0?fIdx:8;
  document.getElementById('palName').textContent=pal?title(pal.name):ent.primary.toUpperCase();
  document.getElementById('satSlider').value=ent.satellites;
  document.getElementById('satVal').textContent=ent.satellites;
  document.getElementById('ringSlider').value=ent.rings;
  document.getElementById('ringVal').textContent=ent.rings;
  document.getElementById('morphSlider').value=ent.morph;
  document.getElementById('morphVal').textContent=ent.morph+' %';
  const hue=document.getElementById('hueSlider');
  if(document.activeElement!==hue)hue.value=hexHue(ent.primary);
  hue.style.setProperty('--thumb',ent.primary);

  document.getElementById('swatchRow').innerHTML=PALETTES.map(p=>
    `<button class="sw-dot ${pal===p?'on':''}" style="--c:${p.primary};background:linear-gradient(135deg,${p.core},${p.primary} 55%,${p.secondary})" title="${title(p.name)}" aria-label="${title(p.name)}" onclick="setPalette('${p.id}')"></button>`
  ).join('');

  document.getElementById('stateRow').innerHTML=Object.entries(STATUS_META).map(([k,m])=>
    `<button class="st-btn ${ent.status===k?'on':''}" onclick="setStatus('${k}')">${title(m.label)}</button>`
  ).join('');
}
function hexHue(hex){
  const [r,g,b]=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255),mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
  if(!d)return 0;
  const h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
  return Math.round((h*60+360)%360);
}
function hueHex(h){
  // Same s/l as the .hue-range gradient, so the thumb shows the exact color picked.
  const s=0.9,l=0.65,a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};
  return '#'+[0,8,4].map(n=>f(n).toString(16).padStart(2,'0')).join('');
}

function renderBatch(){
  document.getElementById('batchGrid').innerHTML=batch.map((e,i)=>{
    return `<article class="batch-card ${e.seed===currentEntity.seed?'selected':''}" style="--ec:${e.primary}" onclick="pickBatch(${i})">
      <canvas class="b-cv" data-i="${i}" width="168" height="168"></canvas>
      <div class="mono bc-seed">${e.seed}</div>
      <div class="mono bc-sub">${e.faces} CARAS · ${e.satellites}S</div>
    </article>`;
  }).join('');
}

function generateBatch(){
  batch=Array.from({length:12},()=>generateEntityFromSeed(randomSeed(),currentEntity.status));
  renderBatch();
}
function pickBatch(i){
  currentEntity=batch[i];
  currentEntity.poke=1.0;
  renderControls();
  renderBatch();
  setView('lab');
}
function syncSeedFromParams(){
  currentEntity.seed=encodeSeed(currentEntity);
}
function setPalette(id){
  const p=PALETTES.find(x=>x.id===id);if(!p)return;
  currentEntity.primary=p.primary;currentEntity.secondary=p.secondary;currentEntity.core=p.core;currentEntity.palName=p.name;currentEntity.poke=0.85;
  syncSeedFromParams();
  renderControls();
}
function setCustomColor(hex){currentEntity.primary=hex;currentEntity.secondary=hex;currentEntity.core='#ffffff';currentEntity.palName=hex.toUpperCase();currentEntity.poke=0.6;syncSeedFromParams();renderControls();}
function setStatus(st){currentEntity.status=st;batch.forEach(b=>b.status=st);currentEntity.poke=0.9;renderControls();}
function applySeed(){
  const s=document.getElementById('seedInput').value.trim();
  if(!s||s===currentEntity.seed){renderControls();return;}
  currentEntity=generateEntityFromSeed(s,currentEntity.status);
  currentEntity.poke=1.0;
  renderControls();showToast('GENERADO DESDE SEMILLA');
}
function randomizeCurrent(){
  if(currentView==='batch'){generateBatch();showToast('12 NUEVOS ENTES');return;}
  currentEntity=generateEntityFromSeed(randomSeed(),currentEntity.status);
  currentEntity.poke=1.0;
  renderControls();
}
function shareEntity(){
  const url=location.origin+location.pathname+'?seed='+encodeURIComponent(currentEntity.seed);
  if(navigator.share){navigator.share({title:'Poly Orb',url}).catch(()=>{});return;}
  if(navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
  showToast('ENLACE COPIADO');
}
document.getElementById('facesSlider').oninput=e=>{
  const step=FACE_STEPS[Number(e.target.value)]||FACE_STEPS[8];
  currentEntity.faces=step.faces;
  currentEntity.poke=0.45;
  syncSeedFromParams();
  renderControls();
};

document.getElementById('satSlider').oninput=e=>{currentEntity.satellites=Number(e.target.value);syncSeedFromParams();renderControls();};
document.getElementById('ringSlider').oninput=e=>{currentEntity.rings=Number(e.target.value);syncSeedFromParams();renderControls();};
document.getElementById('morphSlider').oninput=e=>{currentEntity.morph=Number(e.target.value);syncSeedFromParams();renderControls();};
document.getElementById('hueSlider').oninput=e=>setCustomColor(hueHex(Number(e.target.value)));
document.getElementById('seedInput').onchange=applySeed;
document.getElementById('seedInput').onkeydown=e=>{if(e.key==='Enter')e.target.blur();};

let tt;function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}

let lastT=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;const t=now/1000;
  const stepPhys=e=>stepEntity(e,dt,t);
  stepPhys(currentEntity);
  batch.forEach(b=>{if(b!==currentEntity)stepPhys(b);});

  if(currentView==='lab'){
    drawLivingEntity(heroCanvas.getContext('2d'),currentEntity,heroCanvas.clientWidth,heroCanvas.clientHeight,t,false);
    drawLivingEntity(document.getElementById('syncAv42').getContext('2d'),currentEntity,84,84,t,true);
  } else {
    document.querySelectorAll('.b-cv').forEach(c=>{
      const ent=batch[Number(c.dataset.i)];
      if(ent)drawLivingEntity(c.getContext('2d'),ent,168,168,t,true);
    });
  }
  requestAnimationFrame(tick);
}

generateBatch();
console.assert(batch.every(e=>encodeSeed(decodeSeed(e.seed))===e.seed),'seed round-trip');
renderControls();
requestAnimationFrame(tick);
// Module scope: the inline onclick handlers need these on window.
Object.assign(window,{generateBatch,pickBatch,randomizeCurrent,setPalette,setStatus,setView,shareEntity,toggleHoldFullscreen,toggleMobilePreview});
</script>
</body>
</html>
